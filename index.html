<!doctype html>
<html lang="zh-Hans" class="booting">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>
      How Does AI Interpret and Reshape Culture? · Cultural Constellations
    </title>
    <meta
      name="description"
      content="How does AI interpret and reshape culture? Five constellations of research (museum objects, translation, calligraphy, music, copyright and provenance) on one culture loop, read through actor-network theory and cognitive science. Bilingual."
    />
    <link rel="icon" href="assets/compass.svg" />
    <link rel="stylesheet" href="assets/atlas.css?v=9" />
    <link rel="stylesheet" href="assets/night-sky.css?v=8" />
    <link rel="stylesheet" href="assets/framework.css?v=5" />
    <link rel="stylesheet" href="assets/paper-index.css?v=5" />
  </head>
  <body>
    <header class="head">
      <div class="headin">
        <a class="brand" href="#atlas" aria-label="AI + Humanity"
          ><svg viewBox="0 0 40 40" aria-hidden="true">
            <circle
              cx="20"
              cy="20"
              r="14"
              fill="none"
              stroke="currentColor"
              stroke-width=".7"
            />
            <path
              d="M20 1l2.4 14.2L34 7l-8.8 10.7L39 20l-14.2 2.2L33 33l-10.8-8.1L20 39l-2.3-14.3L7 33l8.3-10.8L1 20l14.2-2.3L7 7l10.8 8.2z"
              fill="none"
              stroke="currentColor"
            />
            <circle cx="20" cy="20" r="2.4" fill="currentColor" /></svg
          ><span>AI <small>+</small> <i>Humanity</i></span></a
        >
        <nav id="explore-nav" class="explore-nav" aria-label="Explore">
          <a href="#atlas" data-mode="fields" data-i="fieldsNav"></a>
          <a href="#papers" data-mode="papers" data-i="papersNav"></a>
          <a href="#theory/stance" data-mode="framework" data-i="theoryNav"></a>
        </nav>
        <div class="langs" role="group" aria-label="Language">
          <button id="zh" type="button" lang="zh-Hans">中文</button
          ><button id="en" type="button" lang="en">EN</button>
        </div>
      </div>
    </header>
    <main id="atlas" class="sky-page">
      <noscript
        >Please enable JavaScript to explore the research. 请启用 JavaScript
        浏览研究内容。</noscript
      >
      <div
        id="graph-scene"
        class="graph-scene"
        role="group"
        aria-describedby="graph-guide"
      >
        <svg id="map" class="map" width="100%" height="100%" role="group">
          <defs>
            <linearGradient
              id="gold-line"
              gradientUnits="userSpaceOnUse"
              x1="0"
              y1="0"
              x2="260"
              y2="90"
              spreadMethod="reflect"
            >
              <stop stop-color="#d39d4e" />
              <stop offset=".45" stop-color="#fff2ba" />
              <stop offset="1" stop-color="#c89144" />
            </linearGradient>
          </defs>
          <g id="edges"></g>
          <path
            id="callout-line"
            class="callout-line"
            aria-hidden="true"
            hidden
          />
        </svg>
        <div id="nodes"></div>
        <nav id="portals" aria-label="Connected papers"></nav>
        <div id="tip" role="tooltip" class="edgeinfo" hidden></div>
        <div
          id="field-caption"
          class="field-caption"
          aria-live="polite"
          hidden
        ></div>
        <section
          id="node-card"
          class="node-card"
          aria-labelledby="card-title"
          hidden
        ></section>
        <div id="index-drawer" hidden>
          <div class="drawer-heading">
            <h2 data-i="papersNav"></h2>
            <button
              type="button"
              class="float-close"
              data-close="index"
            ></button>
          </div>
          <div id="paper-index" tabindex="-1"></div>
        </div>
        <div class="scrim scrim-top" aria-hidden="true"></div>
        <div class="scrim scrim-bottom" aria-hidden="true"></div>
      </div>
      <aside id="foundation" class="rail" aria-labelledby="site-title">
        <button
          type="button"
          id="rail-handle"
          class="rail-handle"
          aria-controls="rail-scroll"
          aria-expanded="false"
        ></button>
        <div id="rail-scroll" class="rail-scroll theory-float">
          <header id="rail-head" class="rail-head"></header>
          <section class="rail-theory" aria-labelledby="theory-heading">
            <h2
              id="theory-heading"
              class="rail-heading"
              data-i="foundation"
            ></h2>
            <div id="theory-inner" tabindex="-1"></div>
          </section>
        </div>
      </aside>
      <nav
        id="loop-tour"
        class="sky-tour"
        aria-label="Culture loop"
        hidden
      ></nav>
      <div class="sky-controls">
        <div class="sky-location">
          <div class="sky-crumbs">
            <button
              type="button"
              class="back-step"
              id="back-step"
              hidden
            ></button>
            <nav id="trail" class="trail" aria-label="Exploration path"></nav>
          </div>
          <span class="guide" id="graph-guide" aria-live="polite"></span>
        </div>
        <div class="camera-tools">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="view-all" type="button"></button>
        </div>
      </div>
    </main>
    <script src="assets/night-sky.js?v=9"></script>
    <script src="assets/catalog.js?v=4"></script>
    <script src="assets/relations.js?v=4"></script>
    <script src="assets/framework.js?v=5"></script>
    <script src="assets/paper-index.js?v=5"></script>
    <script src="assets/atlas.js?v=9"></script>
  </body>
</html>
